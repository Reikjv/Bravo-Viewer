name: Test, build and publish Bravo Viewer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: node --check web/app.js
      - run: bash -n install.sh
      - name: DOM and API
        run: |
          npm install --prefix .tooling --no-save --package-lock=false jsdom@26.1.0
          python tools/preview_fixture.py --port 18090 > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18090/health; then break; fi
            sleep 1
          done
          node tools/test_frontend.cjs http://127.0.0.1:18090/
      - name: Supabase schema
        run: |
          npm install --prefix .tooling/supabase-validation --no-save --package-lock=false @electric-sql/pglite@0.3.14
          node tools/test_supabase_schema.cjs
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, smoke test, push and package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'from rov_history import __version__; print(__version__)')
          IMAGE=bravo-viewer
          REGISTRY=ghcr.io/reikjv/bravo-viewer
          docker buildx build --platform "$PLATFORM" --load -t "$IMAGE:$VERSION" .
          docker run -d --name smoke --platform "$PLATFORM" --memory 256m --cpus .5 "$IMAGE:$VERSION"
          for attempt in {1..30}; do
            if docker exec smoke python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8090/health",timeout=2).read()'; then break; fi
            sleep 1
          done
          docker exec smoke python -c 'import json,urllib.request; o=json.load(urllib.request.urlopen("http://127.0.0.1:8090/api/overview")); assert o["records"]==0; r=json.load(urllib.request.urlopen("http://127.0.0.1:8090/register_service")); assert r["name"]=="Bravo Viewer"'
          docker rm -f smoke
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$VERSION" "$REGISTRY:$VERSION-$ARCH"
          docker push "$REGISTRY:$VERSION-$ARCH"
          docker save "$IMAGE:$VERSION" | gzip > image.tar.gz
          python tools/package_release.py --arch "$ARCH" --image image.tar.gz --public --output artifacts/public
          python tools/create_catalog.py --capture --arch "$ARCH" --registry "$REGISTRY:$VERSION-$ARCH" --output "artifacts/metadata/$ARCH.json"
          if [[ "$ARCH" == arm64 ]]; then python tools/package_release.py --arch source --output artifacts/source; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Bravo-Viewer-${{ matrix.arch }}
          path: artifacts/*
          compression-level: 0
          retention-days: 14
  desktop:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build, install silently and smoke test Windows app
        shell: pwsh
        run: |
          pip install -r requirements.txt -r requirements-desktop.txt
          python -m PyInstaller --noconfirm --clean desktop/BravoViewerDesktop.spec
          $version = python -c "from rov_history import __version__; print(__version__)"
          $numeric = ($version -split '-')[0] + '.0'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DAppNumeric=$numeric" desktop/installer.iss
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          $setup = "artifacts/desktop/Bravo-Viewer-Desktop-v$version-Setup.exe"
          $target = "$env:RUNNER_TEMP\BravoViewer"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait
          $app = Start-Process "$target\BravoViewerDesktop.exe" -ArgumentList '--no-window','--port','18300','--data-dir',"$env:RUNNER_TEMP\bravo-data" -PassThru
          $ok = $false
          foreach ($attempt in 1..40) {
            try { $status = Invoke-RestMethod http://127.0.0.1:18300/api/status; if ($status.mode -eq 'desktop' -and $status.version -eq $version) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $app.Id -Force
          if (-not $ok) { throw 'Installed desktop app did not start' }
          # SHA-256 publicado junto: o atualizador do Desktop só instala o arquivo conferido.
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$setup.sha256" -Value "$hash  $(Split-Path $setup -Leaf)" -Encoding ascii -NoNewline
          Compress-Archive -Path dist/BravoViewerDesktop -DestinationPath "artifacts/desktop/Bravo-Viewer-Desktop-v$version-portable.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Bravo-Viewer-Desktop
          path: artifacts/*
          compression-level: 0
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true
      - name: Multi-platform image, catalog and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'from rov_history import __version__; print(__version__)')
          REGISTRY=ghcr.io/reikjv/bravo-viewer
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$REGISTRY:$VERSION" "$REGISTRY:$VERSION-arm64" "$REGISTRY:$VERSION-armv7"
          python tools/create_catalog.py --metadata-dir artifacts/metadata --output artifacts/manifest.json
          gh release create "$TAG" artifacts/source/* artifacts/public/* artifacts/desktop/* artifacts/manifest.json --title "Bravo Viewer $TAG" --generate-notes --prerelease
